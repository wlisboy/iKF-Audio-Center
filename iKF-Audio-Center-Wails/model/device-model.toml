# 端点 → 官方 Endpoint 名 / DataFlow（.profile 的 <EffectGroup> 头）
[profile_endpoint]
render = ["Speakers", "Out"]
capture = ["Mic", "In"]

# 数值类型 → ValueType 文本（官方用 .NET 类型名）
[profile_value_type]
bool = "System.UInt32"
int = "System.Int32"
float = "System.Single"
