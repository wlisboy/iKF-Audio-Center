# ----------------------------------------------------------------
# 可写白名单（80 = render 62 + capture 12 + SS×16 + EQ×10 + 声道×2）
# ----------------------------------------------------------------
# 全部经实机「写入→读回」往返验证。S3 起唯一真源，两线白名单/值域/离散
# 全由本节派生。字段：
#   ep    render=扬声器链  capture=麦克风链（麦克风参数打渲染端点必 ret=2）
#   t     bool | int | float —— 与两线 kind/TBool…/「bool」… 一一对应
#   lo/hi 数值钳制区间；缺省 = 不钳制（如 SS_*_DIST，驱动自己管）
#   choices 离散取值白名单（驱动对非法值返回 0x10003，先在应用层收口）
# ★ 不登记 = /api/params 报 w=false = 界面控件点不动（铁律 1）。
# ★ '#' 名是虚拟参数（声道索引），不进 208 表、不进 .profile。
# 历史真值注释（GFSControl 恢复登记、SURRSENS 绑定更正、声道拓扑证伪等）
# 完整保留在 git 历史与当日日志里；此处只留每条的行内短注。

