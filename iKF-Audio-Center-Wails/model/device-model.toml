# device-model.toml —— 数据即真源
# ====================================================================
# 唯一真相。Python 线（tools/src/center_src.py，tomllib）与 Go 线
# （go:embed + BurntSushi/toml）都只是本文件的解释器。
# 改这里 = 两线同步；代码里不再保留字面数据表。
# 加载失败 / 自校验不过 = 拒绝启动，绝不内置兜底。
#
# 分阶段抽取进度（见 docs/device-model-抽取清单.md）—— S1-S5 全部完成（2026-10-23）：
#   S1 ✅ 场景排除 / 内置场景 / 分组别名
#   S2 ✅ 出厂表 42 + 初始化设备级 1
#   S3 ✅ 名字表 208 + 可写白名单 80 + 值域
#   S4 ✅ 组态分组名（ApoEffect Canvas）+ 端点定义
#   S5 ✅ 闸门基线从 TOML 派生（init_manifest_gate 等）
#
# 自校验基线（两线共同断言，漂移即拒绝启动）：
#   scene.exclude = 6   scene.unproven = 35   scene.builtin = 6   group_alias = 10
#   names = 208（generic 112 + oem 96）   writable = 80（render 65 + capture 15）
#   factory = 42   init_device = 1   profile_groups = 53

[meta]
schema_version = 1
device = "iKF"

# ---------------------------------------------------------------- 场景
[scene]
# 「预设」档 = FactoryDefault.xml；「默认」= 原「原厂默认」（2026-10-20 改名）。
# 名字必须与 EnsureSeedScenes 播种的文件名一致。
factory_profile = "预设"
factory_scene = "默认"

# 内置场景名单：源包自带 + 播种。★ builtin 判定按名字、不按目录：
# 便携包下用户自建场景与内置档同住 CPL\profile，按目录一刀切会把用户场景
# 也标成内置（2026-10-19 真机确认过这个坑）。
builtin = ["默认", "音乐", "电影", "UserDefine", "UserDefineFormwork", "HiFi"]

# 设备级状态：个人听音 / 硬件事实，进场景会被系统回滚或触发端点重建。
# ★ DevSampleRateControl 最要命：写它触发 USB 重协商 → 端点重建 →
#   采集端会话值全清（「应用场景后麦克风页整体不同步」的根因）。
exclude = [
    "VolumeControl",            # 主音量：个人听音状态，写入被系统通路回滚
    "VolumeScalarControl",      # 标量形态同上
    "MuteControl",              # 静音
    "AAVolumeControl",          # 模拟功放音量
    "DevSampleRateControl",     # 设备采样率：触发端点重建
    "Speaker_Channel_Setting",  # 设备级声道拓扑，设备页自选
]

# APO 未实现 / 未验证生效的家族：不进场景（2026-10-19 用户拍板）。
unproven = [
    # SS 虚拟环绕家族（总开关 + 8 方位角 + 8 距离）
    "Enable_SS_LFX",
    "SS_C_ANGLE", "SS_LF_ANGLE", "SS_RF_ANGLE", "SS_LS_ANGLE",
    "SS_RS_ANGLE", "SS_LB_ANGLE", "SS_RB_ANGLE", "SS_LFE_ANGLE",
    "SS_C_DIST", "SS_LF_DIST", "SS_RF_DIST", "SS_LS_DIST",
    "SS_RS_DIST", "SS_LB_DIST", "SS_RB_DIST", "SS_LFE_DIST",
    # Dolby 家族
    "Enable_DHDVS_LFX", "DHDVS_USEDH", "DH_Mode", "DVS_Mode",
    # 动态低音 / 音频增艳 / 语音清晰度
    "Enable_BM_GFX", "BM_Slider_BassLevel", "BM_Slider_Frequency",
    "Enable_AUDIOBRILLIANT_LFX", "AUDIOBRILLIANT_LEVEL",
    "Enable_VOICECLARITY_LFX", "VOICECLARITY_LEVEL",
    "VOICECLARITY_NOISESUPP_LEVEL",
    # 环绕增强：CXearSurrMaxLib 有实体，但 A/B 未测到生效（前置条件依赖）
    "Enable_SURRSENS_LFX",
    # 虚拟低音 / SonicMapper / DDL / PLIIX / NeoPC
    "Enable_VIRTUALBASS_LFX", "Enable_SonicMapper",
    "Enable_DDL_GFX", "Enable_PLIIX_LFX", "Enable_NEOPC_LFX",
]

# ---------------------------------------------------------------- 分组别名
# 旧版工具写出过的分组名 → 归一到现在的 Canvas 名。
# ★ 只用于读：用户已存下来的旧场景不该因改名而显示成「其他」。

[group_alias]
Volume = "SpeakerVolume"
Environment = "SpeakerEM"
Karaoke = "SpeakerKaraoke"
KeyShift = "SpeakerKaraoke"
SamplingRate = "SpeakerSamplingRate"
ChannelCopy = "SpeakerSetting"
XearSurroundSpeakers = "SpeakerVirtual"
NoiseReduction = "MicInNoiseReduction"
XearMagicVoice = "MicInXearMagicVoice"
AAVolume = "MicInVolume"


